# Sample guest plugins. This is a separate workspace because every member is
# compiled for `wasm32-wasip2`, not for the host target.
[workspace]
resolver = "3"
members = ["sdk", "hello", "counter", "fetcher", "hostile", "sneaky"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"] }
plugbox-sdk = { path = "sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
